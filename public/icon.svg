<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- POS Monitor Frame -->
  <g filter="url(#shadow)">
    <!-- Monitor Base & Stand -->
    <path d="M216 380 L296 380 L310 420 L202 420 Z" fill="#94a3b8" />
    <rect x="170" y="420" width="172" height="18" rx="9" fill="#64748b" />
    
    <!-- Monitor Screen Outer -->
    <rect x="100" y="110" width="312" height="250" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
    
    <!-- Inner Screen Display -->
    <rect x="120" y="130" width="272" height="210" rx="14" fill="url(#screenGrad)" />
    
    <!-- Header Bar on Screen -->
    <rect x="135" y="148" width="242" height="28" rx="6" fill="#1e3a8a" />
    <circle cx="155" cy="162" r="5" fill="#38bdf8" />
    <circle cx="172" cy="162" r="5" fill="#60a5fa" />
    <rect x="195" y="158" width="80" height="8" rx="4" fill="#93c5fd" />

    <!-- POS Cart / Items Display -->
    <rect x="135" y="190" width="130" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="148" y="205" width="70" height="8" rx="4" fill="#64748b" />
    <rect x="148" y="222" width="104" height="8" rx="4" fill="#64748b" />
    <rect x="148" y="240" width="50" height="8" rx="4" fill="#10b981" />
    <rect x="148" y="258" width="85" height="8" rx="4" fill="#38bdf8" />

    <!-- Total / Cashier Keypad -->
    <rect x="280" y="190" width="97" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <circle cx="298" cy="210" r="7" fill="#38bdf8" />
    <circle cx="328" cy="210" r="7" fill="#38bdf8" />
    <circle cx="358" cy="210" r="7" fill="#38bdf8" />
    <circle cx="298" cy="235" r="7" fill="#38bdf8" />
    <circle cx="328" cy="235" r="7" fill="#38bdf8" />
    <circle cx="358" cy="235" r="7" fill="#38bdf8" />
    <rect x="290" y="255" width="77" height="15" rx="5" fill="#10b981" />

    <!-- Barcode Scanner / Checkout symbol below -->
    <rect x="135" y="295" width="242" height="30" rx="6" fill="#10b981" />
    <!-- Checkmark icon -->
    <path d="M245 310 L253 318 L269 302" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
